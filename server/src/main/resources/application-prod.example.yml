server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8000}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/dianming?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors-origins: ${CORS_ORIGINS}
  bootstrap:
    login: ${BOOTSTRAP_LOGIN}
    password: ${BOOTSTRAP_PASSWORD}
